<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="g1" cx="72%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="18%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#c25cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c25cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="90%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#050308"/>

  <!-- glow orbs -->
  <circle cx="800" cy="450" r="380" fill="url(#g1)"/>
  <circle cx="340" cy="640" r="300" fill="url(#g2)"/>
  <circle cx="1350" cy="180" r="260" fill="#7c3aed" opacity="0.18" filter="url(#blur)"/>
  <circle cx="150" cy="150" r="220" fill="#c25cff" opacity="0.16" filter="url(#blur)"/>
  <circle cx="1400" cy="760" r="260" fill="#22c55e" opacity="0.10" filter="url(#blur)"/>

  <!-- fine grid -->
  <g stroke="#ffffff" stroke-opacity="0.025">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- floating particles -->
  <g fill="#c9b8f5">
    <circle cx="200" cy="220" r="2.5" opacity="0.7"><animate attributeName="cy" values="220;260;220" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1280" cy="300" r="2" opacity="0.5"><animate attributeName="cy" values="300;340;300" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="700" r="3" opacity="0.6"><animate attributeName="cy" values="700;740;700" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1490" cy="520" r="2" opacity="0.55"><animate attributeName="cy" values="520;555;520" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="420" r="2.2" opacity="0.5"><animate attributeName="cy" values="420;455;420" dur="10s" repeatCount="indefinite"/></circle>
  </g>
</svg>