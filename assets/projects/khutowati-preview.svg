<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#0d0d0f"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="glowline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <circle cx="560" cy="50" r="160" fill="#22c55e" opacity="0.07" filter="url(#soft)"/>
  <circle cx="60" cy="380" r="120" fill="#10b981" opacity="0.06" filter="url(#soft)"/>

  <!-- top neon divider -->
  <rect x="0" y="0" width="640" height="2.5" fill="url(#glowline)"/>

  <!-- header bar -->
  <rect x="0" y="0" width="640" height="52" fill="#0a0a0c" opacity="0.9"/>
  <circle cx="36" cy="26" r="6" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="54" y="32" font-family="Cairo, Segoe UI, sans-serif" font-weight="800" font-size="19" fill="#22c55e">خطواتي</text>

  <!-- login card -->
  <rect x="205" y="92" width="230" height="236" rx="16" fill="#141416" opacity="0.94" stroke="#22c55e" stroke-opacity="0.35"/>
  <rect x="205" y="92" width="230" height="236" rx="16" fill="none" stroke="#22c55e" stroke-opacity="0.25">
    <animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <text x="320" y="126" font-family="Cairo, Segoe UI, sans-serif" font-weight="700" font-size="20" fill="#f4f4f5" text-anchor="middle">تسجيل الدخول</text>
  <text x="320" y="148" font-family="Cairo, Segoe UI, sans-serif" font-size="12.5" fill="#71717a" text-anchor="middle">أهلاً بعودتك إلى المنصة المغاربية</text>

  <text x="222" y="176" font-family="Cairo, Segoe UI, sans-serif" font-size="12" fill="#a1a1aa">البريد الإلكتروني</text>
  <rect x="222" y="184" width="196" height="34" rx="9" fill="#0f0f11" stroke="#27272a"/>
  <text x="232" y="206" font-family="Cairo, Segoe UI, sans-serif" font-size="12.5" fill="#3f3f46">you@example.com</text>

  <text x="222" y="238" font-family="Cairo, Segoe UI, sans-serif" font-size="12" fill="#a1a1aa">كلمة المرور</text>
  <rect x="222" y="246" width="196" height="34" rx="9" fill="#0f0f11" stroke="#22c55e" stroke-opacity="0.6"/>
  <text x="232" y="268" font-family="Cairo, Segoe UI, sans-serif" font-size="12.5" fill="#3f3f46">••••••••</text>

  <rect x="222" y="288" width="196" height="36" rx="10" fill="#22c55e">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="320" y="312" font-family="Cairo, Segoe UI, sans-serif" font-weight="700" font-size="14.5" fill="#04140a" text-anchor="middle">دخول</text>

  <!-- floating steps decoration -->
  <rect x="96" y="210" width="70" height="60" rx="14" fill="#131316" stroke="#22c55e" stroke-opacity="0.5"/>
  <circle cx="131" cy="232" r="9" fill="#22c55e" opacity="0.85"/>
  <text x="131" y="256" font-family="Cairo, Segoe UI, sans-serif" font-size="10" fill="#71717a" text-anchor="middle" font-weight="700">خطوة</text>

  <rect x="474" y="210" width="70" height="60" rx="14" fill="#131316" stroke="#10b981" stroke-opacity="0.5"/>
  <circle cx="509" cy="232" r="9" fill="#10b981" opacity="0.85"/>
  <text x="509" y="256" font-family="Cairo, Segoe UI, sans-serif" font-size="10" fill="#71717a" text-anchor="middle" font-weight="700">هدف</text>

  <text x="320" y="368" font-family="Cairo, Segoe UI, sans-serif" font-size="11.5" fill="#22c55e" text-anchor="middle" font-weight="600">● رحلة البكالوريا وتطوير الذات، خطوة بخطوة</text>
</svg>