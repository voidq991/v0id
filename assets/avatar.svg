<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#241a4d"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#a970ff"/>
      <stop offset="100%" stop-color="#c25cff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="150" fill="#131026" stroke="#2a2154" stroke-width="2"/>

  <!-- stylized letter V glyph -->
  <g transform="translate(256,256)">
    <path d="M -58 -70 L -14 62 L -2 22 L 14 62 L 58 -70"
          fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>
  </g>

  <text x="256" y="438" font-family="Cairo, Segoe UI, sans-serif" font-weight="800" font-size="40" fill="#e9e4ff" text-anchor="middle" filter="url(#glow)">v0id</text>
</svg>